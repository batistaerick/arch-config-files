name = "snapshots"
name_pretty = "Snapshots"
parent = "system"
icon = "󰋊"
fixed_order = true

[[entries]]
text = "Configure Snapshot Protection"
subtext = "Requires Btrfs root; never formats or repartitions"
icon = "󰒃"
actions = { open = "kitty --hold -e sudo /usr/local/lib/eitr/eitr-system snapshots-setup" }

[[entries]]
text = "List Recovery Snapshots"
icon = "󰋊"
actions = { open = "kitty --hold -e sudo snapper -c root list" }

[[entries]]
text = "Recovery Instructions"
icon = "󰧑"
actions = { open = "kitty --hold -e sh -c 'f=\"$HOME/.local/share/eitr/RECOVERY.md\"; if [ -r \"$f\" ]; then less \"$f\"; else echo \"Recovery instructions are not installed. Read distro/RECOVERY.md in the Eitr repository, or see distro/README.md (Existing desktop).\"; fi'" }
