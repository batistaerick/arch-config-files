name = "system"
name_pretty = "System"
parent = "main"
icon = ""
fixed_order = true

[[entries]]
text = "About"
icon = ""
actions = { "open" = "$HOME/.config/walker/scripts/actions/about.sh" }

[[entries]]
text = "AI Usage"
keywords = ["claude", "codex", "limits", "tokens"]
icon = "󱜙"
actions = { "open" = "bash $HOME/.config/quickshell/desktop-bar/scripts/show-panel.sh ai" }

[[entries]]
text = "Audio"
icon = ""
actions = { "open" = "bash $HOME/.config/quickshell/desktop-bar/scripts/show-panel.sh volume" }

[[entries]]
text = "Bluetooth"
icon = ""
actions = { "open" = "bash $HOME/.config/quickshell/desktop-bar/scripts/show-panel.sh bluetooth" }

[[entries]]
text = "Calendar"
icon = "󰃭"
actions = { "open" = "bash $HOME/.config/quickshell/desktop-bar/scripts/show-panel.sh calendar" }

[[entries]]
text = "Cleanup"
keywords = ["clean", "cache", "disk", "storage", "ssd"]
icon = "󰃢"
actions = { "open" = "kitty --class system-cleanup -e $HOME/.config/walker/scripts/actions/system/cleanup.sh" }

[[entries]]
text = "Display"
keywords = ["brightness", "nightlight", "monitor", "resolution", "refresh rate", "power profile", "battery", "performance"]
icon = "󰍹"
actions = { "open" = "bash $HOME/.config/quickshell/desktop-bar/scripts/show-panel.sh display" }

[[entries]]
text = "Dotfiles"
keywords = ["config"]
icon = ""
actions = { "open" = "code $HOME/.config" }

[[entries]]
text = "Hardware"
keywords = ["gpu", "cpu", "ram", "memory", "monitor"]
icon = "󰍛"
actions = { "open" = "bash $HOME/.config/quickshell/desktop-bar/scripts/show-panel.sh hardware" }

[[entries]]
text = "Keyboard"
keywords = ["layout", "language", "input", "alt shift"]
icon = "󰌌"
actions = { "open" = "bash $HOME/.config/quickshell/desktop-bar/scripts/show-panel.sh keyboard" }

[[entries]]
text = "Microphone"
icon = "󰍬"
actions = { "open" = "bash $HOME/.config/quickshell/desktop-bar/scripts/show-panel.sh mic" }

[[entries]]
text = "Security"
subtext = ">"
icon = "󰒃"
submenu = "security"

[[entries]]
text = "Snapshots"
subtext = ">"
icon = "󰋊"
submenu = "snapshots"

[[entries]]
text = "Update"
subtext = ">"
icon = ""
submenu = "update"

[[entries]]
text = "Weather"
icon = "󰖐"
actions = { "open" = "bash $HOME/.config/quickshell/desktop-bar/scripts/show-panel.sh weather" }

[[entries]]
text = "WiFi"
keywords = ["network", "impala"]
icon = ""
actions = { "open" = "bash $HOME/.config/quickshell/desktop-bar/scripts/show-panel.sh wifi" }

[[entries]]
text = "Workspace Overview"
keywords = ["workspaces", "windows", "expose", "overview"]
icon = "󰕮"
actions = { "open" = "bash $HOME/.config/quickshell/desktop-bar/scripts/show-panel.sh overview" }
