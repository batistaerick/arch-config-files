name = "system"
name_pretty = "System"
parent = "main"
icon = ""
fixed_order = true

[[entries]]
text = "Audio"
icon = ""
actions = { "open" = "pavucontrol" }

[[entries]]
text = "WiFi"
keywords = ["network", "impala"]
icon = ""
actions = { "open" = "$HOME/.config/quickshell/desktop-bar/scripts/open-panel.sh setup-wifi kitty --class setup-wifi -e impala" }

[[entries]]
text = "Bluetooth"
icon = ""
actions = { "open" = "blueman-manager" }

[[entries]]
text = "Dotfiles"
keywords = ["config"]
icon = ""
actions = { "open" = "code $HOME/.config" }

[[entries]]
text = "Update"
subtext = ">"
icon = ""
submenu = "update"

[[entries]]
text = "Cleanup"
keywords = ["clean", "cache", "disk", "storage", "ssd"]
icon = "󰃢"
actions = { "open" = "kitty --class system-cleanup -e $HOME/.config/walker/scripts/actions/system/cleanup.sh" }

[[entries]]
text = "About"
icon = ""
actions = { "open" = "$HOME/.config/walker/scripts/actions/about.sh" }
